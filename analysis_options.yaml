# Static analysis configuration.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/*.drift.dart'

linter:
  rules:
    always_declare_return_types: true
    avoid_print: true
    directives_ordering: true
    prefer_const_constructors: true
    prefer_final_locals: true
    # Public named params mapped to private fields are the standard DI pattern;
    # initializing formals cannot express them (a private named param can't be
    # passed by external callers).
    prefer_initializing_formals: false
    prefer_single_quotes: true
    unawaited_futures: true
